
syntax = "proto3";
package Oreka;
message ColorThemes {

    message Themes {
        string id = 1;
        string name = 2;
        repeated string color = 3;
        repeated string fontColor = 4;
        bool default = 5;
    }

    string type = 1;
    string loginUser = 2;
    repeated Themes themes = 3;
}